
name: BridgOps CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bridgops_test
          POSTGRES_PASSWORD: ci_placeholder_password
          POSTGRES_DB: bridgops_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridgops_test -d bridgops_test_db"
          --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      POSTGRES_USER: bridgops_test
      POSTGRES_PASSWORD: ci_placeholder_password
      POSTGRES_DB: bridgops_test_db
      POSTGRES_PORT: 5432
      TEST_DATABASE_URL: postgresql+psycopg://bridgops_test:ci_placeholder_password@localhost:5432/bridgops_test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run backend tests
        run: python -m pytest -v
        
      - name: Check Python linting
        run: python -m ruff check app tests

      - name: Check Python formatting
        run: python -m ruff format --check app tests


  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
