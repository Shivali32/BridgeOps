
name: BridgOps CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  compose:
    name: PostgreSQL, Kafka and Browser Verification
    runs-on: ubuntu-latest
    env:
      INGEST_TOKEN: ci_local_ingestion_token
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure isolated demo environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose --profile app config --quiet
      - name: Build and start the actual images
        run: docker compose --profile app up -d --build
      - name: Verify PostgreSQL backend, migrations and Python checks in the actual image
        run: |
          docker compose --profile app exec -T api python -m alembic check
          docker compose --profile app exec -T api python -c "import os,subprocess,sys; from app.db import DATABASE_URL; env=dict(os.environ, TEST_DATABASE_URL=DATABASE_URL.render_as_string(hide_password=False), WORKFLOW_MODE='inline'); sys.exit(subprocess.call([sys.executable,'-m','pytest','-q'], env=env))"
          docker compose --profile app exec -T api python -m ruff check app tests scripts
          docker compose --profile app exec -T api python -m ruff format --check app tests scripts
      - name: Verify HTTP order workflow
        run: python apps/api/scripts/smoke_compose.py
      - name: Verify Kafka interruptions and duplicate delivery
        run: python apps/api/scripts/smoke_kafka.py
      - name: Verify repeatable three-retailer demo
        run: |
          docker compose --profile app exec -T api python scripts/demo.py
          docker compose --profile app exec -T api python scripts/demo.py
      - name: Verify repeatable five-store grocery presentation
        run: |
          docker compose --profile app exec -T api python scripts/grocery_demo.py
          docker compose --profile app exec -T api python scripts/grocery_demo.py
      - name: Set up Node for asynchronous browser journeys
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Run browser journeys through Kafka
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: "true"
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-browser-evidence
          path: apps/web/test-results
          retention-days: 7
      - name: Show logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Stop isolated services
        if: always()
        run: docker compose --profile app down
