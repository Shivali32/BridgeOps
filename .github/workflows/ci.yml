
name: BridgOps CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bridgops_test
          POSTGRES_PASSWORD: ci_placeholder_password
          POSTGRES_DB: bridgops_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridgops_test -d bridgops_test_db"
          --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      POSTGRES_USER: bridgops_test
      POSTGRES_PASSWORD: ci_placeholder_password
      POSTGRES_DB: bridgops_test_db
      POSTGRES_PORT: 5432
      TEST_DATABASE_URL: postgresql+psycopg://bridgops_test:ci_placeholder_password@localhost:5432/bridgops_test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run backend tests
        run: python -m pytest -v
        
      - name: Check Python linting
        run: python -m ruff check app tests

      - name: Check Python formatting
        run: python -m ruff format --check app tests

      - name: Set up Node for browser verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install browser test dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser workflow against PostgreSQL and HTTP services
        env:
          ENABLE_DEMO_ADMIN: "true"
        run: |
          python -m uvicorn app.main:app --port 8000 > /tmp/bridgops-api.log 2>&1 &
          python -m uvicorn app.providers.inventory:app --port 8001 > /tmp/bridgops-inventory.log 2>&1 &
          python -m uvicorn app.providers.fulfillment:app --port 8002 > /tmp/bridgops-fulfillment.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8000/health
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8001/health
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8002/health
          cd ../web
          npx playwright test

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-workflow-evidence
          path: apps/web/test-results
          retention-days: 7


  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
